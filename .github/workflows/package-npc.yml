name: Package NPC clients

on:
  push:
    paths:
      - '.github/workflows/package-npc.yml'
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Download NPC client packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p npc-v0.26.10-packages
          cd npc-v0.26.10-packages
          base='https://github.com/ehang-io/nps/releases/download/v0.26.10'
          files=(
            linux_amd64_client.tar.gz
            linux_386_client.tar.gz
            linux_arm64_client.tar.gz
            linux_arm_v7_client.tar.gz
            linux_arm_v6_client.tar.gz
            linux_arm_v5_client.tar.gz
            linux_mips_client.tar.gz
            linux_mipsle_client.tar.gz
            linux_mips64_client.tar.gz
            linux_mips64le_client.tar.gz
            windows_amd64_client.tar.gz
            windows_386_client.tar.gz
          )
          for f in "${files[@]}"; do
            echo "Downloading $f"
            curl -fL --retry 3 -o "$f" "$base/$f"
          done
          sha256sum *.tar.gz > SHA256SUMS.txt
          ls -lh

      - name: Upload package bundle
        uses: actions/upload-artifact@v4
        with:
          name: npc-v0.26.10-all-platforms
          path: npc-v0.26.10-packages/
          compression-level: 0
          retention-days: 1
