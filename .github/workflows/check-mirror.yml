name: Check NPC mirror

on:
  push:
    paths:
      - '.github/workflows/check-mirror.yml'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Verify mirror files
        shell: bash
        run: |
          set -euo pipefail
          base='https://dl.runsh.de/npc/v0.26.10'
          files=(
            linux_amd64_client.tar.gz
            linux_386_client.tar.gz
            linux_arm64_client.tar.gz
            linux_arm_v7_client.tar.gz
            linux_arm_v6_client.tar.gz
            linux_arm_v5_client.tar.gz
            linux_mips_client.tar.gz
            linux_mipsle_client.tar.gz
            linux_mips64_client.tar.gz
            linux_mips64le_client.tar.gz
            windows_amd64_client.tar.gz
            windows_386_client.tar.gz
          )
          for f in "${files[@]}"; do
            url="$base/$f"
            echo "=== $url ==="
            code=$(curl -L -sS -o /tmp/npc-test.bin -w '%{http_code}' --connect-timeout 15 --max-time 120 "$url")
            size=$(wc -c < /tmp/npc-test.bin)
            echo "HTTP=$code SIZE=$size"
            test "$code" = "200"
            test "$size" -gt 100000
            tar -tzf /tmp/npc-test.bin >/dev/null
            echo "OK $f"
          done
